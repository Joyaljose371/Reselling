<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14173A"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Haat Bazaar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: announcement strip, sticky header (brand, search, account/wishlist/cart), scrolling category rail,
   hero carousel + coupon strip + category tiles on the home view, then a filterable product grid.
   Detail, cart, checkout, account and seller panel are full views swapped into <main>. */
:root{
  --bg:#F3F4F9; --surface:#FFFFFF; --surface-2:#ECEEF7; --ink:#14173A; --muted:#575C7D; --line:#DCDFEC;
  --brand:#2B2F8F; --brand-ink:#FFFFFF; --brand-tint:#E6E8FA;
  --accent:#C93A14; --accent-ink:#FFFFFF; --gold:#F2A900;
  --good:#0B7A53; --good-bg:#DCF3EA; --bad:#B8222F; --bad-bg:#FBE3E6; --warn:#7A5600; --warn-bg:#FFF0C7;
  --head-bg:#14173A; --head-ink:#FFFFFF; --focus:#4B50E6;
  --shadow:0 1px 2px rgba(20,23,58,.08),0 10px 28px -14px rgba(20,23,58,.22);
  --font-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D0F22; --surface:#171A36; --surface-2:#21254A; --ink:#EEF0FF; --muted:#A5AACE; --line:#2C3162;
    --brand:#9096FF; --brand-ink:#0D0F22; --brand-tint:#252A5E;
    --accent:#FF7A55; --accent-ink:#1E0A03; --gold:#FFD25E;
    --good:#4FDBA0; --good-bg:#103A2C; --bad:#FF7F8C; --bad-bg:#45171E; --warn:#FFD25E; --warn-bg:#40340F;
    --head-bg:#080A1B; --head-ink:#FFFFFF; --focus:#A9ADFF;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D0F22; --surface:#171A36; --surface-2:#21254A; --ink:#EEF0FF; --muted:#A5AACE; --line:#2C3162;
  --brand:#9096FF; --brand-ink:#0D0F22; --brand-tint:#252A5E;
  --accent:#FF7A55; --accent-ink:#1E0A03; --gold:#FFD25E;
  --good:#4FDBA0; --good-bg:#103A2C; --bad:#FF7F8C; --bad-bg:#45171E; --warn:#FFD25E; --warn-bg:#40340F;
  --head-bg:#080A1B; --head-ink:#FFFFFF; --focus:#A9ADFF;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img{display:block}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:1240px;margin-inline:auto;padding-inline:16px}
.pad{padding-block:18px 56px}
.muted{color:var(--muted)}
.h1{font-family:var(--font-display);font-weight:800;font-size:clamp(24px,3.4vw,34px);line-height:1.1;text-wrap:balance}
.h2{font-family:var(--font-display);font-weight:800;font-size:clamp(19px,2.3vw,25px);line-height:1.15;text-wrap:balance}
.h3{font-family:var(--font-display);font-weight:600;font-size:17px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sec{margin-top:28px}
.lk{background:none;border:0;padding:0;text-align:left;color:inherit;font-weight:600}
.lk:hover{text-decoration:underline}
.tb{background:none;border:0;padding:6px 0;color:var(--brand);font-weight:700;font-size:14px}
.tb:hover{text-decoration:underline}
.tb.bad{color:var(--bad)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:1.5px solid transparent;background:var(--surface-2);color:var(--ink);font-weight:700;text-decoration:none}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.brand{background:var(--brand);color:var(--brand-ink)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* header */
.ann{background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:600;text-align:center;padding:6px 0}
.mode{background:var(--warn-bg);color:var(--warn);font-size:13px;font-weight:600;text-align:center;padding:6px 16px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--head-bg);color:var(--head-ink)}
.topin{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:10px}
.brand-b{display:flex;align-items:center;gap:9px;background:none;border:0;color:inherit;font-family:var(--font-display);font-weight:600;font-size:22px;padding:0}
.brand-b b{font-weight:800;color:var(--gold)}
.mark{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--gold);color:#14173A;font-weight:800;font-size:20px}
.search{flex:1 1 320px;display:flex;min-width:0;order:2}
.search input{flex:1;min-width:0;min-height:44px;border:0;border-radius:10px 0 0 10px;padding:0 14px;background:var(--surface);color:var(--ink)}
.search button{min-width:48px;border:0;border-radius:0 10px 10px 0;background:var(--gold);color:#14173A;display:grid;place-items:center}
.acts{display:flex;gap:4px;margin-left:auto;order:1}
.hbtn{position:relative;display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 10px;border-radius:10px;border:0;background:transparent;color:inherit;font-weight:600}
.hbtn:hover{background:rgba(255,255,255,.1)}
.cnt{position:absolute;top:2px;right:0;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;display:grid;place-items:center}
@media (min-width:860px){.search{order:0}.acts{order:0;margin-left:0}}
.rail{background:var(--surface);border-bottom:1px solid var(--line)}
.rail-in{display:flex;gap:6px;overflow-x:auto;padding-block:8px;scrollbar-width:thin}
.cat{flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px 0 8px;border-radius:99px;border:1.5px solid transparent;background:transparent;font-weight:600;white-space:nowrap}
.cat img{width:30px;height:30px;border-radius:50%;background:var(--surface-2)}
.cat:hover{background:var(--surface-2)}
.cat.on{background:var(--brand-tint);border-color:var(--brand);color:var(--brand)}

/* hero */
.hero{position:relative;border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.slides{display:flex;transition:transform .55s cubic-bezier(.3,.7,.2,1)}
.slide{position:relative;flex:0 0 100%;min-width:0;min-height:230px;padding:30px clamp(20px,5vw,56px);display:flex;flex-direction:column;justify-content:center;gap:10px;overflow:hidden}
.slide .copy{position:relative;z-index:1;max-width:min(520px,70%)}
.slide .h1{font-size:clamp(24px,4vw,40px)}
.slide p{margin-top:8px;font-size:16px;opacity:.95}
.slide .btn{margin-top:14px;width:fit-content}
.slide .eyebrow{color:inherit;opacity:.85}
.s1{background:linear-gradient(110deg,#262A86,#5B3FD1);color:#fff}
.s2{background:linear-gradient(110deg,#FFC53D,#FF8A3D);color:#2A1600}
.s2 .btn{background:#241400;color:#fff}
.s3{background:linear-gradient(110deg,#0A5E4D,#12A37F);color:#fff}
.hart{position:absolute;right:clamp(6px,5vw,60px);bottom:-14px;width:clamp(120px,24vw,250px);transform:rotate(6deg);filter:drop-shadow(0 12px 14px rgba(0,0,0,.22))}
.hart.b{right:clamp(100px,22vw,290px);bottom:-30px;width:clamp(90px,17vw,190px);transform:rotate(-8deg)}
@media (max-width:560px){.slide .copy{max-width:100%}.hart{opacity:.25}}
.dots{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:8px;z-index:2}
.dot-b{width:11px;height:11px;border-radius:50%;border:0;background:rgba(255,255,255,.5);padding:0}
.dot-b[aria-current="true"]{background:#fff;width:26px;border-radius:99px}
.hnav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.85);color:#14173A;font-size:20px;font-weight:700;z-index:2;display:none}
.hnav.l{left:10px}.hnav.r{right:10px}
@media (min-width:760px){.hnav{display:block}}

/* coupons + tiles */
.cps{display:flex;gap:12px;overflow-x:auto;padding-block:4px 8px}
.cp{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 14px;border:1.5px dashed var(--brand);border-radius:12px;background:var(--surface);min-width:250px}
.cp code{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:800;font-size:16px;color:var(--brand)}
.cp p{font-size:13px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:8px;padding:0;border:0;background:none;text-align:center;font-weight:600;font-size:14px}
.tile img{width:100%;aspect-ratio:1/1;border-radius:16px;border:1px solid var(--line)}
.tile:hover img{border-color:var(--brand)}
@media (max-width:560px){
  .tiles{grid-auto-flow:column;grid-auto-columns:minmax(64px,20vw);grid-template-columns:none;gap:8px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
  .tile{gap:5px;font-size:12px}
  .tile{scroll-snap-align:start}
  .tile img{border-radius:10px}
}

/* listing */
.bar{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.sel{min-height:40px;border:1.5px solid var(--line);border-radius:10px;padding:0 10px;background:var(--surface);color:var(--ink)}
.note{padding:10px 14px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:13.5px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
@media (min-width:900px){.grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}}
.card{display:flex;flex-direction:column;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card .im{position:relative;aspect-ratio:1/1;background:var(--surface-2)}
.imb{display:block;width:100%;height:100%;padding:0;border:0;background:none}
.imb img{width:100%;height:100%;object-fit:cover}
.wish{position:absolute;top:8px;right:8px;width:38px;height:38px;border-radius:50%;border:0;background:var(--surface);color:var(--muted);display:grid;place-items:center;box-shadow:var(--shadow)}
.wish.on{color:var(--accent)}
.wish.on svg{fill:currentColor}
.oos{position:absolute;left:8px;bottom:8px;background:var(--bad);color:#fff;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px}
.cb{display:flex;flex-direction:column;gap:7px;padding:12px;flex:1;min-width:0}
.pn{font-size:14px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px}
.pr b{font-family:var(--font-display);font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.pr s{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.pr .off{color:var(--good);font-weight:700;font-size:13px}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.low{font-size:12.5px;font-weight:700;color:var(--bad)}
.card .btn{margin-top:auto}
.rpill{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:99px;background:var(--good);color:#fff;font-weight:700;font-size:12.5px}
.dark-pill{color:#06281C}
.rnew{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--surface-2);font-weight:700;font-size:12.5px}
.stars{font-size:18px;letter-spacing:1px;background:linear-gradient(90deg,var(--gold) var(--p),var(--line) var(--p));-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:700;background:var(--surface-2)}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.empty{text-align:center;padding:48px 16px;border:1.5px dashed var(--line);border-radius:14px;display:flex;flex-direction:column;gap:8px;align-items:center}

/* panels + forms */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:20px;align-items:start}
@media (max-width:920px){.split{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-size:13px;font-weight:700}
.in{width:100%;min-height:44px;padding:0 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
textarea.in{padding:10px 12px;min-height:90px;resize:vertical}
.in:focus{border-color:var(--brand)}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.fe,.ferr{color:var(--bad);font-size:13px;min-height:1px}
.hint{font-size:12.5px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{justify-content:space-between}
.sum{display:flex;flex-direction:column;gap:10px}
.sum .r{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.sum .t{font-family:var(--font-display);font-weight:800;font-size:20px;border-top:1px solid var(--line);padding-top:12px}
.sum .g{color:var(--good);font-weight:600}
.save{background:var(--good-bg);color:var(--good);font-weight:700;font-size:13.5px;padding:8px 12px;border-radius:10px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle;font-variant-numeric:tabular-nums}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tabs{display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--line);margin-block:16px}
.tab{flex:0 0 auto;padding:12px 16px;border:0;background:none;font-weight:700;color:var(--muted);border-bottom:3px solid transparent}
.tab[aria-selected="true"]{color:var(--brand);border-color:var(--brand)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;min-width:44px;padding:0 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:600}
.chip[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-tint);color:var(--brand)}
.step{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.step button{width:40px;height:40px;border:0;background:var(--surface-2);font-size:18px;font-weight:700}
.step span{min-width:38px;text-align:center;font-weight:700}

/* detail */
.pd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:860px){.pd{grid-template-columns:minmax(0,1fr)}}
.gal{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px}
@media (max-width:520px){.gal{grid-template-columns:minmax(0,1fr)}.gal .th{flex-direction:row;order:2}}
.th{display:flex;flex-direction:column;gap:8px}
.th button{padding:0;border:2px solid var(--line);border-radius:10px;overflow:hidden;width:72px;height:72px;background:none}
.th button[aria-current="true"]{border-color:var(--brand)}
.th img,.mainimg img{width:100%;height:100%;object-fit:cover}
.mainimg{aspect-ratio:1/1;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2)}
.big{font-family:var(--font-display);font-weight:800;font-size:32px;font-variant-numeric:tabular-nums}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.own{padding:10px 14px;border-radius:10px;background:var(--brand-tint);color:var(--brand);font-weight:600;font-size:14px}
.dl{display:grid;grid-template-columns:140px minmax(0,1fr);gap:8px 14px;font-size:14px}
.dl dt{color:var(--muted)}.dl dd{margin:0}
.rev{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.av{flex:0 0 38px;height:38px;border-radius:50%;background:var(--brand-tint);color:var(--brand);display:grid;place-items:center;font-weight:800}
.rate{display:flex;gap:4px}
.rate button{background:none;border:0;font-size:30px;line-height:1;padding:2px;color:var(--line)}
.rate button.on{color:var(--gold)}

/* cart */
.line{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.lim{width:84px;height:84px;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface-2)}
.lim img{width:100%;height:100%;object-fit:cover}
.li{display:flex;flex-direction:column;gap:6px;min-width:0}
.lq{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.lt{font-family:var(--font-display);font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.cpbox{display:flex;gap:8px}
.cpl{display:flex;flex-direction:column;gap:6px}
.cpi{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;padding:8px 10px;border:1px dashed var(--line);border-radius:10px}
.cpi code{font-weight:800;color:var(--brand)}

/* checkout + orders */
.stepper{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.stp{flex:1 1 120px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);font-weight:700;font-size:14px;color:var(--muted);background:var(--surface)}
.stp.on{border-color:var(--brand);color:var(--brand);background:var(--brand-tint)}
.stp.done{color:var(--good);border-color:var(--good)}
.acard{display:flex;gap:12px;text-align:left;width:100%;padding:14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface)}
.acard[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-tint)}
.radio{flex:0 0 20px;height:20px;border-radius:50%;border:2px solid var(--muted);margin-top:2px}
[aria-pressed="true"]>.radio{border:6px solid var(--brand)}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.checks li{display:flex;gap:8px}
.checks .ok{color:var(--good)}.checks .no{color:var(--bad)}
.order{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.oh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:14px 16px;background:var(--surface-2)}
.ob{padding:16px;display:flex;flex-direction:column;gap:14px}
.oi{display:flex;gap:12px;align-items:center}
.oi img{width:56px;height:56px;border-radius:8px;object-fit:cover;border:1px solid var(--line)}
.tl{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));list-style:none;margin:0;padding:0;font-size:12.5px;font-weight:600;color:var(--muted)}
.tl li{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.tl li::before{content:"";position:absolute;top:6px;left:-50%;width:100%;height:3px;background:var(--line)}
.tl li:first-child::before{display:none}
.tl .dot{position:relative;z-index:1;width:15px;height:15px;border-radius:50%;background:var(--line)}
.tl li.done{color:var(--ink)}
.tl li.done::before,.tl li.done .dot{background:var(--good)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{padding:16px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.stat b{display:block;font-family:var(--font-display);font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.prev{display:flex;gap:10px;flex-wrap:wrap}
.prev div{position:relative}
.prev img{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.prev button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--bad);color:#fff;font-weight:700}

/* modal + toast + footer */
.ov{position:fixed;inset:0;z-index:100;background:rgba(8,10,28,.62);display:grid;place-items:center;padding:16px}
.dlg{width:100%;max-width:440px;max-height:90vh;overflow:auto;background:var(--surface);border-radius:16px;padding:22px;box-shadow:var(--shadow)}
.dlg .x{float:right;background:none;border:0;font-size:24px;line-height:1;color:var(--muted)}
#toasts{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:120;display:flex;flex-direction:column;align-items:center;gap:8px;padding-inline:16px;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:14px;max-width:460px;padding:12px 16px;border-radius:12px;background:var(--head-bg);color:#fff;font-weight:600;box-shadow:var(--shadow)}
.toast button{background:none;border:0;color:var(--gold);font-weight:800}
.ftr{margin-top:40px;background:var(--head-bg);color:#C9CCEB;padding-block:30px;font-size:14px}
.ftr .wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:24px}
.ftr h4{color:#fff;margin-bottom:8px;font-family:var(--font-display)}
.ftr button{display:block;background:none;border:0;color:inherit;padding:4px 0;text-align:left}
.ftr a{display:block;color:inherit;padding:4px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

function couponCheck(c,sub,u){
  if(!c||!c.active)return{ok:false,msg:'This coupon is not active'};
  if(sub<c.min)return{ok:false,msg:'Add '+inr(c.min-sub)+' more to use '+c.code};
  if(c.first&&u&&S.orders.some(o=>o.uid===u.uid&&o.status!=='Cancelled'))return{ok:false,msg:c.code+' works on your first order only'};
  if(c.type==='ship')return{ok:true,off:0,ship:true};
  let off=c.type==='pct'?Math.round(sub*c.value/100):c.value;
  if(c.cap)off=Math.min(off,c.cap);
  return{ok:true,off:Math.min(off,sub)};
}
function totals(lines,coupon,u){
  const sub=lines.reduce((s,l)=>s+price(l.p)*l.qty,0);
  const mrp=lines.reduce((s,l)=>s+l.p.mrp*l.qty,0);
  const minimum=Number(S.settings.freeShippingMinimum)||0;
  const allProductsFree=lines.length>0&&lines.every(l=>l.p.freeDelivery===true);
  let shipping=(!sub||(minimum>0&&sub>=minimum)||allProductsFree)?0:(Number(S.settings.shippingFee)||0),off=0,res=null;
  if(coupon){res=couponCheck(coupon,sub,u);if(res.ok){off=res.off;if(res.ship)shipping=0}}
  return{sub,mrp,off,shipping,total:Math.max(0,sub-off)+shipping,saved:(mrp-sub)+off,res};
}

function normalizeState(state){
  const aliases={Orissa:'Odisha',Pondicherry:'Puducherry',Uttaranchal:'Uttarakhand','Jammu and Kashmir':'Jammu & Kashmir','NCT of Delhi':'Delhi','Dadra and Nagar Haveli':'Dadra & Nagar Haveli and Daman & Diu','Daman and Diu':'Dadra & Nagar Haveli and Daman & Diu'};
  return aliases[state]||state;
}
async function lookupPin(pin){
  if(!/^\d{6}$/.test(pin))throw new Error('Enter a 6-digit PIN code');
  if(PIN_LOCATIONS[pin])return PIN_LOCATIONS[pin];
  if(PIN_REQUESTS[pin])return PIN_REQUESTS[pin];
  PIN_REQUESTS[pin]=(async()=>{
    const response=await fetch('https://api.postalpincode.in/pincode/'+encodeURIComponent(pin));
    if(!response.ok)throw new Error('PIN lookup is unavailable right now. Try again in a moment.');
    const result=await response.json();
    const record=Array.isArray(result)?result[0]:null;
    if(!record||record.Status!=='Success'||!Array.isArray(record.PostOffice))return [];
    return record.PostOffice.filter(p=>p&&p.Name&&p.District&&p.State).map(p=>({
      name:String(p.Name).trim(),district:String(p.District).trim(),state:normalizeState(String(p.State).trim())
    }));
  })();
  try{PIN_LOCATIONS[pin]=await PIN_REQUESTS[pin];return PIN_LOCATIONS[pin]}
  finally{delete PIN_REQUESTS[pin]}
}
async function showPinLocations(pin,form){
  const hint=form.querySelector('#pin-h'),select=form.querySelector('#pin-office');
  if(!hint||!select)return;
  select.innerHTML='<option value="">Loading matching post offices…</option>';
  select.disabled=true;select.hidden=false;
  try{
    const locations=await lookupPin(pin);
    if(form.elements.pin.value!==pin)return;
    PIN_LOCATIONS[pin]=locations;
    if(!locations.length){hint.textContent='No matching India Post offices found for this PIN code.';select.innerHTML='<option value="">No post offices found</option>';return}
    select.innerHTML='<option value="">Select your post office / locality</option>'+locations.map((p,i)=>'<option value="'+i+'">'+esc(p.name+' · '+p.district+', '+p.state)+'</option>').join('');
    select.disabled=false;
    hint.textContent='Select your post office to fill district and state.';
  }catch(e){
    if(form.elements.pin.value===pin)hint.textContent=e.message||'Could not look up this PIN code. Try again.';
  }
}

const FAR=['Andaman & Nicobar Islands','Lakshadweep','Ladakh','Arunachal Pradesh','Mizoram','Manipur','Nagaland','Tripura','Meghalaya','Sikkim','Assam','Jammu & Kashmir'];
function pinInfo(pin){
  if(!/^\d{6}$/.test(pin))return{ok:false,msg:'Enter a 6-digit PIN code'};
  if(pin[0]==='0'||pin[0]==='9')return{ok:false,msg:'This is not a deliverable civilian PIN code'};
  const st=pinStates(pin);
  if(!st)return{ok:false,msg:'This PIN code is not in a valid India Post range'};
  return{ok:true,states:st,days:st.some(s=>FAR.includes(s))?'8 to 12':'4 to 7'};
}
function verifyAddress(v){
  const out=[];const add=(ok,label,good,bad)=>out.push({ok,label,msg:ok?good:bad});
  const nm=v.name.trim(),ph=v.phone.trim(),pin=v.pin.trim(),city=v.city.trim(),house=v.house.trim();
  const junk=/(test|asdf|qwer|xxxx|abcd|dummy|fake)/i;
  add(/^[\p{L} .'-]{2,60}$/u.test(nm)&&!junk.test(nm),'Name','Looks good','Use the recipient’s real name, letters only');
  add(/^[6-9]\d{9}$/.test(ph)&&!/^(\d)\1{9}$/.test(ph),'Mobile number','10-digit Indian mobile','Enter a valid 10-digit mobile starting with 6, 7, 8 or 9');
  const validPin=/^\d{6}$/.test(pin)&&pin[0]!=='0'&&pin[0]!=='9';
  add(validPin,'PIN code','6-digit India Post PIN format','Enter a valid 6-digit PIN code');
  const locations=PIN_LOCATIONS[pin]||[],officeIndex=String(v.postOffice||''),selected=officeIndex===''?null:locations[Number(officeIndex)];
  add(!!selected,'PIN locality',selected?'Matches '+selected.name+', '+selected.district:'Select a matching India Post office from the PIN lookup results');
  add(!!selected&&selected.state===v.state,'PIN and state match',selected?'PIN '+pin+' belongs to '+selected.state:'Select a matching post office and state','Select a matching post office and state');
  if(selected)add(v.city===selected.district,'District','Matches '+selected.district,'Use the district returned for this PIN code');
  add(/^[\p{L} .'-]{2,40}$/u.test(city)&&!junk.test(city),'City / town','Looks good','Enter your city or town, letters only');
  add(house.length>=8&&/\p{L}/u.test(house)&&!/(.)\1{4,}/.test(house)&&!junk.test(house),'House and street','Looks complete','Enter flat or house number, building and street (at least 8 characters)');
  return{ok:out.every(x=>x.ok),checks:out};
}

const LIVE=!!(firebaseConfig&&firebaseConfig.apiKey&&!/^YOUR_/.test(firebaseConfig.apiKey));
const clean=o=>JSON.parse(JSON.stringify(o));
let DB=null;
async function sha(s){
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){let h=5381;for(const ch of s)h=((h<<5)+h+ch.charCodeAt(0))>>>0;return 'x'+h.toString(16)}
}
function errText(e){
  const c=(e&&e.code)||'';
  const m={'auth/invalid-credential':'Email or password is incorrect','auth/wrong-password':'Email or password is incorrect','auth/user-not-found':'Email or password is incorrect',
    'auth/invalid-email':'Enter a valid email address','auth/email-already-in-use':'This email is already registered. Try signing in.','auth/weak-password':'Password needs at least 8 characters',
    'auth/network-request-failed':'No connection. Check your internet and try again.','auth/too-many-requests':'Too many attempts. Wait a minute and try again.',
    'permission-denied':'Not allowed. Sign in again, or check your Firestore rules.','unavailable':'Cannot reach the database right now.','reviewed':'You have already reviewed this product'};
  return m[c]||(e&&e.message)||'Something went wrong';
}

function makeLocal(){
  const D={mode:'local'};let cb=null,watch=null;
  const rd=(k,d)=>store.get('haat.'+k,d),wr=(k,v)=>store.set('haat.'+k,v);
  let products=rd('products',null),coupons=rd('coupons',null),users=rd('users',[]),orders=rd('orders',[]),reviews=rd('reviews',{}),storeSettings=Object.assign({},DEFAULT_STORE_SETTINGS,rd('storeSettings',{}));
  if(!products){products=seedProducts();wr('products',products)}
  if(!coupons){coupons=seedCoupons();wr('coupons',coupons)}
  const pub=u=>u?{uid:u.uid,email:u.email,name:u.name,phone:u.phone,addresses:u.addresses||[]}:null;
  const meNow=()=>pub(users.find(u=>u.uid===rd('session',null)));
  const ownerUid=()=>(claimOwnerOnFirstSignup&&users.length)?users[0].uid:null;
  const ordersFor=()=>{const m=meNow();if(!m)return[];return m.uid===ownerUid()?orders.slice():orders.filter(o=>o.uid===m.uid)};
  const pushP=()=>cb.products(clean(products)),pushC=()=>cb.coupons(clean(coupons)),pushO=()=>{if(watch)watch(clean(ordersFor()))};
  D.start=c=>{cb=c;pushP();pushC();cb.owner(ownerUid());cb.settings(storeSettings);cb.me(meNow())};
  D.watchOrders=(me,owner,fn)=>{watch=fn;fn(clean(ordersFor()))};
  D.signUp=async(name,email,phone,pw)=>{
    if(users.some(u=>u.email===email))throw {code:'auth/email-already-in-use'};
    const salt=Math.random().toString(36).slice(2);
    const u={uid:'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),email,name,phone,salt,hash:await sha(salt+pw),addresses:[],at:Date.now()};
    const claimed=claimOwnerOnFirstSignup&&users.length===0;
    users.push(u);wr('users',users);wr('session',u.uid);
    return{me:pub(u),claimed};
  };
  D.signIn=async(email,pw)=>{
    const u=users.find(x=>x.email===email);
    if(!u||(await sha(u.salt+pw))!==u.hash)throw {code:'auth/invalid-credential'};
    wr('session',u.uid);return pub(u);
  };
  D.signOut=async()=>{wr('session',null)};
  D.saveProfile=async(uid,patch)=>{const u=users.find(x=>x.uid===uid);if(!u)return;Object.assign(u,clean(patch));wr('users',users)};
  D.saveStoreSettings=async settings=>{storeSettings=Object.assign({},DEFAULT_STORE_SETTINGS,clean(settings));if(!wr('storeSettings',storeSettings))throw new Error('Browser storage is full; store settings could not be saved.');cb.settings(storeSettings)};
  D.saveProduct=async p=>{const i=products.findIndex(x=>x.id===p.id);if(i>=0)products[i]=clean(p);else products.unshift(clean(p));if(!wr('products',products))throw new Error('Browser storage is full. Use fewer or smaller photos.');pushP()};
  D.deleteProducts=async ids=>{products=products.filter(p=>!ids.includes(p.id));wr('products',products);pushP()};
  D.seed=async()=>{products=seedProducts();if(!coupons.length)coupons=seedCoupons();wr('products',products);wr('coupons',coupons);pushP();pushC()};
  D.saveCoupon=async c=>{const i=coupons.findIndex(x=>x.code===c.code);if(i>=0)coupons[i]=clean(c);else coupons.push(clean(c));wr('coupons',coupons);pushC()};
  D.deleteCoupon=async code=>{coupons=coupons.filter(c=>c.code!==code);wr('coupons',coupons);pushC()};
  D.placeOrder=async o=>{
    const need={};o.items.forEach(i=>{need[i.pid]=(need[i.pid]||0)+i.qty});
    for(const id in need){const p=products.find(x=>x.id===+id);if(!p)throw new Error('gone|'+id);if(p.stock<need[id])throw new Error('stock|'+p.name+'|'+p.stock)}
    for(const id in need){products.find(x=>x.id===+id).stock-=need[id]}
    orders.push(clean(o));wr('products',products);wr('orders',orders);pushP();pushO();
  };
  D.setStatus=async(o,status)=>{
    const c=orders.find(x=>x.id===o.id);if(!c||c.status==='Cancelled')return;
    if(status==='Cancelled')c.items.forEach(i=>{const p=products.find(x=>x.id===i.pid);if(p)p.stock+=i.qty});
    c.status=status;if(status==='Delivered'){c.paid=true;if(!c.deliveredAt)c.deliveredAt=Date.now()}if(status==='Cancelled')c.cancelRequested=false;
    wr('orders',orders);wr('products',products);pushP();pushO();
  };
  D.requestCancel=async id=>{const c=orders.find(x=>x.id===id);if(c){c.cancelRequested=true;wr('orders',orders);pushO()}};
  D.requestReturn=async id=>{
    const c=orders.find(x=>x.id===id);
    if(!c||c.status!=='Delivered'||!c.deliveredAt||Date.now()-c.deliveredAt>=RETURN_WINDOW_MS)throw new Error('The 7-day return request window has ended.');
    if(c.returnRequested)throw new Error('A return request has already been sent.');
    c.returnRequested=true;c.returnRequestedAt=Date.now();wr('orders',orders);pushO();
  };
  D.loadReviews=async pid=>(reviews[pid]||[]).slice().sort((a,b)=>b.at-a.at);
  D.addReview=async(pid,rev)=>{
    const l=reviews[pid]||(reviews[pid]=[]);
    if(l.some(r=>r.uid===rev.uid))throw {code:'reviewed'};
    const order=orders.find(o=>o.id===rev.orderId&&o.uid===rev.uid&&(o.status==='Delivered'||o.status==='Return'||RETURN_FLOW.includes(o.status))&&o.items.some(i=>JSON.stringify(i)===JSON.stringify(rev.orderItem)&&i.pid===pid));
    if(!order)throw new Error('Reviews are available after this product has been delivered.');
    l.push(clean(rev));const p=products.find(x=>x.id===pid);if(p){p.rated.sum+=rev.rating;p.rated.n+=1}
    wr('reviews',reviews);wr('products',products);pushP();
  };
  D.resetAll=async()=>{
    products=seedProducts();coupons=seedCoupons();users=[];orders=[];reviews={};storeSettings=Object.assign({},DEFAULT_STORE_SETTINGS);
    wr('products',products);wr('coupons',coupons);wr('users',users);wr('orders',orders);wr('reviews',reviews);wr('session',null);wr('storeSettings',storeSettings);
    cb.me(null);cb.owner(null);cb.settings(storeSettings);pushP();pushC();pushO();
  };
  return D;
}

async function makeFirebase(){
  const B='https://www.gstatic.com/firebasejs/10.14.1/';
  const [A,Au,F]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
  const app=A.initializeApp(firebaseConfig),auth=Au.getAuth(app),fs=F.getFirestore(app);
  const {collection,doc,getDoc,getDocs,setDoc,updateDoc,deleteDoc,onSnapshot,query,where,runTransaction,writeBatch,serverTimestamp}=F;
  const D={mode:'firebase'};let onErr=()=>{},ounsub=null;
  const toMe=(u,d)=>({uid:u.uid,email:u.email,name:(d&&d.name)||u.email,phone:(d&&d.phone)||'',addresses:(d&&d.addresses)||[]});
  D.start=cb=>{
    onErr=cb.error;
    onSnapshot(collection(fs,'products'),s=>cb.products(s.docs.map(d=>d.data())),cb.error);
    onSnapshot(collection(fs,'coupons'),s=>cb.coupons(s.docs.map(d=>d.data())),cb.error);
    onSnapshot(doc(fs,'config','store'),s=>{
      const data=s.exists()?s.data():{};
      cb.owner(data.ownerUid||null);
      cb.settings(Object.assign({},DEFAULT_STORE_SETTINGS,data));
    },cb.error);
    let un=null;
    Au.onAuthStateChanged(auth,u=>{
      if(un){un();un=null}
      if(!u){cb.me(null);return}
      un=onSnapshot(doc(fs,'users',u.uid),s=>cb.me(toMe(u,s.exists()?s.data():null)),cb.error);
    });
  };
  D.watchOrders=(me,owner,fn)=>{
    if(ounsub){ounsub();ounsub=null}
    if(!me){fn([]);return}
    const q=owner?collection(fs,'orders'):query(collection(fs,'orders'),where('uid','==',me.uid));
    ounsub=onSnapshot(q,s=>fn(s.docs.map(d=>d.data())),e=>{fn([]);onErr(e)});
  };
  D.signUp=async(name,email,phone,pw)=>{
    const c=await Au.createUserWithEmailAndPassword(auth,email,pw),u=c.user;
    await setDoc(doc(fs,'users',u.uid),{name,phone,email,addresses:[],at:Date.now()});
    let claimed=false;
    if(claimOwnerOnFirstSignup){try{await setDoc(doc(fs,'config','store'),{ownerUid:u.uid,at:Date.now()});claimed=true}catch(e){}}
    return{me:toMe(u,{name,phone,addresses:[]}),claimed};
  };
  D.signIn=async(email,pw)=>{
    const c=await Au.signInWithEmailAndPassword(auth,email,pw),s=await getDoc(doc(fs,'users',c.user.uid));
    return toMe(c.user,s.exists()?s.data():null);
  };
  D.signOut=()=>Au.signOut(auth);
  D.saveProfile=(uid,patch)=>setDoc(doc(fs,'users',uid),clean(patch),{merge:true});
  D.saveStoreSettings=settings=>setDoc(doc(fs,'config','store'),clean(settings),{merge:true});
  D.saveProduct=p=>setDoc(doc(fs,'products',String(p.id)),clean(p));
  D.deleteProducts=async ids=>{const b=writeBatch(fs);ids.forEach(id=>b.delete(doc(fs,'products',String(id))));await b.commit()};
  D.seed=async()=>{
    const b=writeBatch(fs);
    seedProducts().forEach(p=>b.set(doc(fs,'products',String(p.id)),clean(p)));
    if(!S.coupons.length)seedCoupons().forEach(c=>b.set(doc(fs,'coupons',c.code),c));
    await b.commit();
  };
  D.saveCoupon=c=>setDoc(doc(fs,'coupons',c.code),clean(c));
  D.deleteCoupon=code=>deleteDoc(doc(fs,'coupons',code));
  D.placeOrder=async o=>{
    const need={};o.items.forEach(i=>{need[i.pid]=(need[i.pid]||0)+i.qty});
    await runTransaction(fs,async tx=>{
      const ids=Object.keys(need),refs=ids.map(id=>doc(fs,'products',id)),snaps=await Promise.all(refs.map(r=>tx.get(r)));
      snaps.forEach((s,k)=>{const d=s.exists()?s.data():null;if(!d)throw new Error('gone|'+ids[k]);if(d.stock<need[ids[k]])throw new Error('stock|'+d.name+'|'+d.stock)});
      snaps.forEach((s,k)=>tx.update(refs[k],{stock:s.data().stock-need[ids[k]]}));
      tx.set(doc(fs,'orders',o.id),clean(o));
      tx.set(doc(fs,'mail',o.id+'-placed'),{
        to:o.email,orderId:o.id,event:'placed',at:Date.now(),
        message:{subject:'Order '+o.id+' received',text:'Hi '+o.name+', your order '+o.id+' has been placed. Total: '+inr(o.total)+'.'}
      });
    });
  };
  D.setStatus=async(o,status)=>{
    await runTransaction(fs,async tx=>{
      const oref=doc(fs,'orders',o.id),os=await tx.get(oref);if(!os.exists())return;
      const cur=os.data();if(cur.status==='Cancelled')return;
      const back={};if(status==='Cancelled')cur.items.forEach(i=>{back[i.pid]=(back[i.pid]||0)+i.qty});
      const ids=Object.keys(back),ps=await Promise.all(ids.map(id=>tx.get(doc(fs,'products',id))));
      ps.forEach((s,k)=>{if(s.exists())tx.update(s.ref,{stock:s.data().stock+back[ids[k]]})});
      const patch={status};if(status==='Delivered'){patch.paid=true;if(!cur.deliveredAt)patch.deliveredAt=serverTimestamp()}if(status==='Cancelled')patch.cancelRequested=false;
      tx.update(oref,patch);
      if(cur.status!==status&&(status==='Confirmed'||status==='Delivered')){
        const at=Date.now(),event=status.toLowerCase();
        tx.set(doc(fs,'mail',o.id+'-'+event+'-'+at),{
          to:cur.email,orderId:o.id,event,at,
          message:{subject:'Order '+o.id+' '+event,text:'Hi '+cur.name+', your order '+o.id+' is now '+event+'.'}
        });
      }
    });
  };
  D.requestCancel=id=>updateDoc(doc(fs,'orders',id),{cancelRequested:true});
  D.requestReturn=id=>updateDoc(doc(fs,'orders',id),{returnRequested:true,returnRequestedAt:serverTimestamp()});
  D.loadReviews=async pid=>{const s=await getDocs(collection(fs,'products',String(pid),'reviews'));return s.docs.map(d=>d.data()).sort((a,b)=>b.at-a.at)};
  D.addReview=async(pid,rev)=>{
    await runTransaction(fs,async tx=>{
      const pref=doc(fs,'products',String(pid)),rref=doc(fs,'products',String(pid),'reviews',rev.uid);
      const oref=doc(fs,'orders',String(rev.orderId));
      const [ps,rs,os]=await Promise.all([tx.get(pref),tx.get(rref),tx.get(oref)]);
      if(rs.exists())throw {code:'reviewed'};
      if(!os.exists()||os.data().uid!==rev.uid||os.data().status!=='Delivered'||!os.data().items.some(i=>JSON.stringify(i)===JSON.stringify(rev.orderItem)&&i.pid===pid))throw new Error('Reviews are available after this product has been delivered.');
      const r=(ps.data().rated)||{sum:0,n:0};
      tx.set(rref,clean(rev));tx.update(pref,{rated:{sum:r.sum+rev.rating,n:r.n+1}});
    });
  };
  return D;
}

function readFiles(files){
  const room=4-S.formImgs.length;
  Array.from(files).slice(0,Math.max(0,room)).forEach(f=>{
    if(!/^image\//.test(f.type))return;
    const rd=new FileReader();
    rd.onload=()=>{const im=new Image();im.onload=()=>{
      const k=Math.min(1,640/Math.max(im.width,im.height)),cv=document.createElement('canvas');
      cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
      S.formImgs.push(cv.toDataURL('image/jpeg',.7));const pv=$('#pf-prev');if(pv)pv.innerHTML=formPrev();
    };im.src=rd.result};rd.readAsDataURL(f);
  });
}

  place(){placeOrder()},
  async cancelorder(el){
    const o=S.orders.find(x=>x.id===el.dataset.id);if(!o||o.cancelRequested||(o.status!=='Placed'&&o.status!=='Confirmed'))return;
    try{await DB.requestCancel(o.id)}catch(e){toast(errText(e));return}
    o.cancelRequested=true;render();toast('Cancellation requested. The seller will confirm.');
  },
  async returnorder(el){
    const o=S.orders.find(x=>x.id===el.dataset.id);
    if(!o||o.status!=='Delivered'||Date.now()-timestampMs(o.deliveredAt)>=RETURN_WINDOW_MS){toast('The 7-day return request window has ended.');return}
    try{await DB.requestReturn(o.id)}catch(e){toast(errText(e));return}
    o.returnRequested=true;o.returnRequestedAt=Date.now();render();toast('Return request sent to the seller.');
  },
  ownercancel(el){changeStatus(S.orders.find(x=>x.id===el.dataset.id),'Cancelled')},
  async recorddelivery(el){
    if(!ownerOnly())return;
    const o=S.orders.find(x=>x.id===el.dataset.id);
    if(!o||o.status!=='Delivered'||timestampMs(o.deliveredAt))return;
    try{await DB.setStatus(o,'Delivered')}catch(e){toast(errText(e));render();return}
    o.deliveredAt=Date.now();render();toast('Delivery date recorded. The customer can request a return within 7 days.');
  },
  newp(){if(!ownerOnly())return;S.editing='new';S.formImgs=[];render()},
  editp(el){if(!ownerOnly())return;const p=byId(+el.dataset.id);S.editing=p.id;S.formImgs=(p.imgs||[]).slice();render();const f=$('#pf-name');if(f&&f.scrollIntoView)f.scrollIntoView()},
  cancelp(){S.editing=null;render()},
  rmimg(el){S.formImgs.splice(+el.dataset.i,1);$('#pf-prev').innerHTML=formPrev()},
  async delp(el){
    if(!ownerOnly())return;const id=+el.dataset.id,k='p'+id;
    if(S.delArm!==k){S.delArm=k;render();return}
    S.delArm=null;
    try{await DB.deleteProducts([id])}catch(e){toast(errText(e));render();return}
    S.products=S.products.filter(p=>p.id!==id);S.cart=S.cart.filter(i=>i.pid!==id);store.set('haat.cart',S.cart);render();toast('Product deleted');
  },
  async rmsample(){
    if(!ownerOnly())return;const ids=S.products.filter(p=>p.sample).map(p=>p.id);
    try{await DB.deleteProducts(ids)}catch(e){toast(errText(e));return}
    S.products=S.products.filter(p=>!p.sample);S.cart=S.cart.filter(i=>byId(i.pid));store.set('haat.cart',S.cart);render();toast('Sample products removed');
  },
  async loadsample(){if(!ownerOnly())return;try{await DB.seed();toast('Sample products added')}catch(e){toast(errText(e))}},
  async resetstore(){
    if(DB.mode!=='local')return;
    if(S.delArm!=='reset'){S.delArm='reset';render();return}
    S.delArm=null;S.cart=[];S.wish=[];S.couponCode='';store.set('haat.cart',[]);store.set('haat.wish',[]);store.set('haat.coupon','');
    await DB.resetAll();okey='';go('shop');toast('Demo data cleared');
  },
  async togcoupon(el){if(!ownerOnly())return;const c=S.coupons.find(x=>x.code===el.dataset.code);if(!c)return;const n=Object.assign({},c,{active:!c.active});try{await DB.saveCoupon(n)}catch(e){toast(errText(e));return}c.active=n.active;render()},
  async delcoupon(el){
    if(!ownerOnly())return;const code=el.dataset.code,k='c'+code;
    if(S.delArm!==k){S.delArm=k;render();return}
    S.delArm=null;try{await DB.deleteCoupon(code)}catch(e){toast(errText(e));render();return}
    S.coupons=S.coupons.filter(c=>c.code!==code);if(S.couponCode===code)S.couponCode='';render();
  }
};
function applyCoupon(code){
  code=String(code||'').trim().toUpperCase();S.couponInput=code;
  const c=S.coupons.find(x=>x.code===code);
  if(!code){S.couponMsg='Enter a coupon code';return render()}
  if(!c){S.couponMsg='That code is not valid';return render()}
  const t=totals(cartLines(),null,user()),r=couponCheck(c,t.sub,user());
  if(!r.ok){S.couponMsg=r.msg;return render()}
  S.couponCode=code;S.couponMsg='';S.couponInput='';store.set('haat.coupon',code);render();toast(code+' applied');
}
function runVerify(){
  const f=$('#af');if(!f)return false;
  const v={name:val(f,'name'),phone:val(f,'phone'),pin:val(f,'pin'),postOffice:val(f,'postOffice'),state:val(f,'state'),city:val(f,'city'),house:val(f,'house')};
  const r=verifyAddress(v);
  $('#av-res').innerHTML='<ul class="checks">'+r.checks.map(c=>'<li><span class="'+(c.ok?'ok':'no')+'" aria-hidden="true">'+(c.ok?'✓':'✗')+'</span><span><b>'+esc(c.label)+':</b> '+esc(c.msg)+'</span></li>').join('')+'</ul>';
  $('#av-save').hidden=!r.ok;
  if(r.ok)$('#av-save').focus();
  return r.ok;
}

/* ---------- form submits ---------- */
const subs={
  search(f){S.q=$('#q').value.trim();S.cat='all';if(S.view!=='shop')go('shop');else render();const l=$('#listing');if(l&&l.scrollIntoView&&S.q)l.scrollIntoView()},
  async signin(f){
    const err=f.querySelector('.ferr'),email=val(f,'email').toLowerCase(),pw=f.elements.password.value;
    if(!email||!pw){err.textContent='Enter your email and password';return}
    busy(f,true);
    try{S.me=await DB.signIn(email,pw)}catch(e){busy(f,false);err.textContent=errText(e);return}
    syncOrders();toast('Welcome back, '+S.me.name.split(' ')[0]);afterAuth();
  },
  async signup(f){
    const err=f.querySelector('.ferr'),name=val(f,'name'),email=val(f,'email').toLowerCase(),phone=val(f,'phone'),pw=f.elements.password.value;
    if(name.length<2)return void(err.textContent='Enter your name');
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email))return void(err.textContent='Enter a valid email address');
    if(!/^[6-9]\d{9}$/.test(phone))return void(err.textContent='Enter a valid 10-digit mobile number');
    if(pw.length<8)return void(err.textContent='Password needs at least 8 characters');
    busy(f,true);let r;
    try{r=await DB.signUp(name,email,phone,pw)}catch(e){busy(f,false);err.textContent=errText(e);return}
    S.me=r.me;if(r.claimed)S.ownerUid=r.me.uid;syncOrders();
    toast(r.claimed?'Account created. You are the store owner: open Seller panel from the header.':'Welcome to Haat Bazaar, '+name.split(' ')[0]);afterAuth();
  },
  async profile(f){
    const u=user(),err=f.querySelector('.ferr'),name=val(f,'name'),phone=val(f,'phone');
    if(name.length<2)return void(err.textContent='Enter your name');
    if(!/^[6-9]\d{9}$/.test(phone))return void(err.textContent='Enter a valid 10-digit mobile number');
    try{await DB.saveProfile(u.uid,{name,phone})}catch(e){err.textContent=errText(e);return}
    u.name=name;u.phone=phone;refreshHeader();toast('Profile saved');
  },
  coupon(f){applyCoupon(val(f,'code'))},
  async review(f){
    const u=user(),p=byId(S.params.id),err=$('#rv-err');
    if(!u){openAuth('signin',()=>render());return}
    const delivered=deliveredOrdersFor(p.id)[0],orderItem=delivered&&delivered.items.find(i=>i.pid===p.id);
    if(!delivered||!orderItem){err.textContent='Reviews are available after this product has been delivered.';return}
    if(!S.sel.rate){err.textContent='Tap a star rating first';return}
    const text=val(f,'text');if(text.length<5){err.textContent='Write a few words about the product';return}
    if(text.length>600){err.textContent='Keep the review under 600 characters';return}
    const rev={uid:u.uid,user:u.name,rating:S.sel.rate,text,at:Date.now(),orderId:delivered.id,orderItem,verified:true};
    busy(f,true);
    try{await DB.addReview(p.id,rev)}catch(e){busy(f,false);err.textContent=errText(e);return}
    S.reviews[p.id]=[rev].concat(S.reviews[p.id]||[]);S.sel.rate=0;
    if(DB.mode==='firebase'){p.rated={sum:p.rated.sum+rev.rating,n:p.rated.n+1}}
    render();toast('Thanks for your review');
  },
  async addr(f){
    if(!runVerify())return;
    const u=user(),a={id:'a'+Date.now(),name:val(f,'name'),phone:val(f,'phone'),pin:val(f,'pin'),postOffice:(PIN_LOCATIONS[val(f,'pin')]||[])[Number(val(f,'postOffice'))].name,state:val(f,'state'),city:val(f,'city'),house:val(f,'house'),area:val(f,'area'),landmark:val(f,'landmark'),type:val(f,'type')||'Home',verified:true,at:Date.now()};
    const next=u.addresses.concat([a]);
    try{await DB.saveProfile(u.uid,{addresses:next})}catch(e){toast(errText(e));return}
    u.addresses=next;S.co.addr=a.id;S.co.adding=false;render();toast('Address verified and saved');
  },
  async product(f){
    if(!ownerOnly())return;
    const err=$('#pf-err'),name=val(f,'name'),cost=num(val(f,'cost')),margin=num(val(f,'margin')),mrp=num(val(f,'mrp')),stock=parseInt(val(f,'stock'),10);
    if(name.length<3)return void(err.textContent='Enter a product name');
    if(!(cost>0))return void(err.textContent='Enter the supplier price');
    if(!(margin>=0))return void(err.textContent='Enter your margin (0 or more)');
    if(!(mrp>=cost+margin))return void(err.textContent='MRP must be at least the selling price ('+inr(cost+margin)+')');
    if(!(stock>=0))return void(err.textContent='Enter the stock count');
    const bytes=S.formImgs.reduce((s,x)=>s+x.length,0);
    if(bytes>780000)return void(err.textContent='Photos are too large together ('+Math.round(bytes/1024)+' KB, limit about 760 KB). Remove one or use smaller photos.');
    const list=s=>s.split(',').map(x=>x.trim()).filter(Boolean),details={};
    val(f,'details').split('\n').forEach(l=>{const i=l.indexOf(':');if(i>0&&l.slice(i+1).trim())details[l.slice(0,i).trim()]=l.slice(i+1).trim()});
    const cat=CATS.find(c=>c.id===val(f,'cat'))||CATS[0],shape=val(f,'shape')||'notebook';
    const art={shape,a:cat.a,b:cat.b,c:'#FFFFFF',bg:cat.bg,bg2:'#EDE7FF'};
    const data={name,cat:cat.id,cost,margin,mrp,stock,freeDelivery:!!f.elements.freeDelivery.checked,sizes:list(val(f,'sizes')),colors:list(val(f,'colors')),desc:val(f,'desc')||name,details,imgs:S.formImgs.slice(),art};
    let prod;
    if(S.editing==='new')prod=Object.assign({id:S.products.reduce((m,p)=>Math.max(m,p.id),0)+1,rated:{sum:0,n:0},sample:false,at:Date.now()},data);
    else prod=Object.assign({},byId(S.editing),data);
    busy(f,true);
    try{await DB.saveProduct(prod)}catch(e){busy(f,false);err.textContent=errText(e);return}
    const i=S.products.findIndex(p=>p.id===prod.id);if(i>=0)S.products[i]=prod;else S.products.unshift(prod);
    S.editing=null;S.formImgs=[];render();toast('Product saved');
  },
  async newcoupon(f){
    if(!ownerOnly())return;
    const err=f.querySelector('.ferr'),code=val(f,'code').toUpperCase().replace(/[^A-Z0-9]/g,''),type=val(f,'type'),value=num(val(f,'value')),min=num(val(f,'min'))||0,cap=num(val(f,'cap'))||0;
    if(code.length<3)return void(err.textContent='Code needs at least 3 letters or numbers');
    if(S.coupons.some(c=>c.code===code))return void(err.textContent='That code already exists');
    if(type!=='ship'&&!(value>0))return void(err.textContent='Enter the discount value');
    if(type==='pct'&&value>90)return void(err.textContent='Percent off cannot be above 90');
    const desc=val(f,'desc')||(type==='pct'?value+'% off':type==='flat'?inr(value)+' off':'Free delivery');
    const c={code,desc,type,value:type==='ship'?0:value,min,cap,first:!!f.elements.first.checked,active:true};
    try{await DB.saveCoupon(c)}catch(e){err.textContent=errText(e);return}
    S.coupons.push(c);render();toast(code+' added');
  },
  async storesettings(f){
    if(!ownerOnly())return;
    const err=f.querySelector('.ferr'),shippingFee=num(val(f,'shippingFee')),freeShippingMinimum=num(val(f,'freeShippingMinimum'));
    const contactEmail=val(f,'contactEmail').toLowerCase(),contactPhone=val(f,'contactPhone');
    if(!Number.isFinite(shippingFee)||shippingFee<0||shippingFee>2000)return void(err.textContent='Delivery charge must be between ₹0 and ₹2,000');
    if(!Number.isFinite(freeShippingMinimum)||freeShippingMinimum<0||freeShippingMinimum>100000)return void(err.textContent='Free delivery minimum must be between ₹0 and ₹1,00,000');
    if(contactEmail&&!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(contactEmail))return void(err.textContent='Enter a valid customer support email');
    if(contactPhone&&!/^[+\d() .-]{7,20}$/.test(contactPhone))return void(err.textContent='Enter a valid contact number');
    const settings={shippingFee,freeShippingMinimum,contactEmail,contactPhone};
    busy(f,true);
    try{await DB.saveStoreSettings(settings)}catch(e){busy(f,false);err.textContent=errText(e);return}
    S.settings=Object.assign({},DEFAULT_STORE_SETTINGS,settings);refreshHeader();render();toast('Delivery and contact settings saved');
  }
};

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(el){const f=acts[el.dataset.act];if(f){e.preventDefault();f(el,e)}return}
  if(e.target.id==='modal')closeModal();
});
document.addEventListener('submit',e=>{const f=e.target;if(f.dataset&&f.dataset.form&&subs[f.dataset.form]){e.preventDefault();subs[f.dataset.form](f)}});
document.addEventListener('change',e=>{
  const office=e.target.closest('#pin-office');
  if(office){
    const f=office.closest('#af'),places=PIN_LOCATIONS[f.elements.pin.value]||[],p=office.value===''?null:places[Number(office.value)];
    if(p){f.elements.city.value=p.district;f.elements.state.value=p.state}
    const save=$('#av-save');if(save)save.hidden=true;
    const result=$('#av-res');if(result)result.innerHTML='';
    return;
  }
  const el=e.target.closest('[data-chg]');if(!el)return;
  const k=el.dataset.chg;
  if(k==='sort'){S.sort=el.value;render()}
  else if(k==='price'){S.price=el.value;render()}
  else if(k==='rating'){S.minRating=+el.value;render()}
  else if(k==='ostatus')changeStatus(S.orders.find(x=>x.id===el.dataset.id),el.value);
  else if(k==='pfiles'){readFiles(el.files);el.value=''}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){clearTimeout(t._d);t._d=setTimeout(()=>{S.q=t.value.trim();S.cat='all';if(S.view!=='shop'){S.view='shop';S.params={}}render()},280);return}
  if(t.dataset&&t.dataset.inp==='pfcalc'){calcPreview();return}
  if(t.dataset&&t.dataset.inp==='pinhint'){
    const v=t.value.replace(/\D/g,'');t.value=v;const h=$('#pin-h'),select=$('#pin-office');
    if(select){select.hidden=true;select.disabled=true;select.innerHTML='<option value="">Enter a PIN code to look up post offices</option>'}
    const office=$('#af-state'),city=$('#af-city'),area=$('#af-area');
    if(office)office.value='';if(city)city.value='';if(area)area.value='';
    if(v.length===6){h.textContent='Looking up matching post offices…';showPinLocations(v,t.closest('#af'))}
    else h.textContent='';
  }
  const f=t.closest&&t.closest('#af');
  if(f){const s=$('#av-save');if(s)s.hidden=true;const r=$('#av-res');if(r)r.innerHTML=''}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});

/* ---------- start ---------- */
let pendingLink=/^#p-(\d+)$/.exec(location.hash||'');
let lastErr=0;
const cbk={
  products(l){
    S.products=l.map(p=>Object.assign({sizes:[],colors:[],details:{},imgs:[],rated:{sum:0,n:0}},p)).sort((a,b)=>(b.at||0)-(a.at||0));
    S.loaded.products=true;
    if(pendingLink){const p=byId(+pendingLink[1]);pendingLink=null;if(p){S.sel={size:p.sizes.length===1?p.sizes[0]:'',color:p.colors.length===1?p.colors[0]:'',qty:1,img:0,rate:0};S.view='product';S.params={id:p.id};loadReviews(p.id)}}
    softRender();
  },
  coupons(l){S.coupons=l;softRender()},
  owner(uid){S.ownerUid=uid;syncOrders();softRender()},
  settings(s){S.settings=Object.assign({},DEFAULT_STORE_SETTINGS,s);refreshHeader();softRender()},
  me(m){S.me=m;syncOrders();softRender()},
  error(e){console.error(e);if(Date.now()-lastErr>6000){lastErr=Date.now();toast(errText(e))}}
};
async function main(){
  buildChrome();
  try{DB=LIVE?await makeFirebase():makeLocal()}
  catch(e){console.error(e);$('#main').innerHTML='<div class="wrap pad">'+empty('Could not connect to Firebase','Check firebase-config.js and your internet connection, then reload.')+'</div>';return}
  const mb=$('#mode');
  if(!LIVE){mb.hidden=false;mb.textContent='Demo mode: data stays in this browser. Add your Firebase config in firebase-config.js to go live.'}
  render();
  DB.start(cbk);
}
main();
</script>
